{% extends 'base/bare_layout.html' %}
{% load static i18n %}

{% block title %}{% trans "Can't connect" %} | {{ company_name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'switchboard/authorize_error.css' %}">
{% endblock %}

{% block content %}
<main class="sb-error">
    <section class="sb-error-card">
        <span class="material-symbols-outlined sb-error-icon">link_off</span>
        <h1 class="sb-error-title">{% trans "Can't connect" %}</h1>
        <p class="sb-error-lead">{{ message }}</p>
        <a href="{% url 'home' %}" class="sb-error-btn">{% trans "Go to Town Hall" %}</a>
    </section>
</main>
{% endblock %}
