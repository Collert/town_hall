{% load console_tags %}<div class="c-field {{ field_class }}{% if field.errors %} has-error{% endif %}" id="field-{{ field.html_name }}"{% if oob %} hx-swap-oob="true"{% endif %}>
    <label class="c-label" for="{{ field.id_for_label }}">{{ label|default:field.label|strip_lang }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<span class="c-help">{{ field.help_text }}</span>{% endif %}
    {% for error in field.errors %}<span class="c-error">{{ error }}</span>{% endfor %}
</div>
